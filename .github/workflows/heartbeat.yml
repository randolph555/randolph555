name: Daily profile heartbeat

on:
  schedule:
    - cron: "10 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Update heartbeat
        run: |
          mkdir -p data
          date -u +"%Y-%m-%dT%H:%M:%SZ" > data/heartbeat.txt

      - name: Commit heartbeat
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: profile heartbeat"
          file_pattern: data/heartbeat.txt
